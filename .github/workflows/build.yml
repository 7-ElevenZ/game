name: Build

on:
    workflow_dispatch:
    push:
        tags:
            - "v*.*.*"

jobs:
    build-linux:
        name: Build for Windows and Linux
        runs-on: ubuntu-latest

        permissions:
          contents: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setuo .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '8.0.x'

            - name: Export the game
              id: export
              uses: firebelley/godot-export@v8.0.0
              with:
                godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
                godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz
                relative_project_path: ./
                archive_output: true

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                body: "THIS IS A TEST RELEASE"
                tag_name: "test"
                name: ${{ github.sha }}
                draft: false
                prerelease: true
                files: 
                  /home/runner/.local/share/godot/archives/Linux.zip |
                  /home/runner/.local/share/godot/archives/Windows.zip
